name: pylint check

on:
  push:
    branches-ignore:
    - renovate/**
    - dependabot/**
  pull_request:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      id: setup_python
      with:
        python-version: '3.15'
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        save-cache: ${{ github.ref == 'refs/heads/master' }}
        cache-suffix: ${{ steps.setup_python.outputs.python-version }}
        version: 0.13.1
    - name: Install deps
      run: uv sync --all-extras --group pylint
    - name: Run pylint
      run: uv run --no-sync pylint --output-format=github translate/ tests/
